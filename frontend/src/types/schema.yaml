            $ref: '#/components/schemas/Tag'
          readOnly: true
        cover_thumbnail_url:
          type: string
          description: Получить URL миниатюры обложки альбома.
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
        name:
          type: string
          title: Наименование
          description: Наименование альбома
          maxLength: 255
        description:
          type: string
          title: Описание
          description: Описание альбома
        slug:
          type: string
          title: Слаг
          description: Слаг альбома
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создан
          description: Дата и время создания альбома
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Обновлен
          description: Дата и время последнего обновления альбома
        public:
          type: boolean
          title: Публичный
          description: Альбом публичный
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Порядок
        cover:
          type: integer
          nullable: true
          title: Обложка
          description: Обложка альбома
      required:
      - cover_thumbnail_url
      - created_at
      - id
      - name
      - photos
      - tags
      - updated_at
