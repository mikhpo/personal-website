      properties:
        id:
          type: integer
          readOnly: true
        author_username:
          type: string
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
          readOnly: true
