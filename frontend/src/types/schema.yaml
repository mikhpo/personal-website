      - topics
      - url
    ArticleWrite:
      type: object
      description: |-
        Сериализатор записи статьи (создание и обновление через форму редактора).

        Автор, слаг и даты заполняются на сервере, поэтому в сериализатор
        не включены. Категории, темы и серии передаются списками первичных
        ключей; пустое значение ключа означает очистку связей. Ответ отдается
        в полном представлении ArticleSerializer, чтобы клиент получал url
        и вложенные объекты статьи.
      properties:
        title:
          type: string
          title: Заголовок
          maxLength: 255
        description:
          type: string
          title: Описание
          maxLength: 255
        content:
          type: string
          title: Содержание
        public:
          type: boolean
          title: Опубликовано
        image:
          type: string
          format: uri
          title: Картинка
        remove_image:
          type: boolean
          writeOnly: true
        categories:
          type: array
          items:
            type: integer
        topics:
          type: array
          items:
            type: integer
        series:
          type: array
          items:
            type: integer
