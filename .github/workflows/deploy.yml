# Workflow для деплоя приложения на VPS сервер
# Запускается вручную из вкладки Actions (workflow_dispatch)
name: Deploy to VPS

# Автоматический запуск после "Release image" отключен: промежуточные
# этапы работы выделяются в отдельные PR, и их автоматическая доставка
# в прод может сломать прод до выполнения общей цели
on:
  workflow_dispatch:

# Параллельные ручные запуски выстраиваются в очередь
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
 deploy:
    runs-on: ubuntu-latest
    steps:
      # Выполнение удаленного скрипта деплоя на сервере
      - name: Execute remote deployment script
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Таймаут удалённой команды: заливка статики в объектное хранилище
          # при холодном старте может занимать десятки минут.
          command_timeout: 30m
          script: |
            cd ${{ secrets.PROJECT_DIR }}
            bash scripts/deploy.sh
