# См. https://pre-commit.com для дополнительной информации
# См. https://pre-commit.com/hooks.html для доступных хуков

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv-lock-check
        description: Проверка актуальности uv.lock относительно pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: uv-sync
        name: uv-sync
        description: Синхронизация виртуального окружения с uv.lock
        entry: uv sync --frozen
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: fix-typography
        name: fix-typography
        description: Автозамена длинного тире (U+2014) на дефис, стрелки (U+2192) на "->" и кавычек-ёлочек (U+00AB, U+00BB) на прямые кавычки
        entry: python3 tools/fix_typography.py
        language: system
        types: [text]
      - id: unwrap-markdown
        name: unwrap-markdown
        description: Развертывание жестких переносов строк в Markdown (абзац - одна строка)
        entry: python3 tools/unwrap_markdown.py
        language: system
        types: [file]
        files: \.(md|markdown)$
      - id: prettier
        name: prettier
        description: Форматирование JavaScript и JSON файлов при помощи Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [file]
        files: \.(json|[cm]?[jt]sx?)$
      - id: eslint
        name: eslint
        description: Статический анализ кода JavaScript при помощи ESLint
        entry: npm run eslint
        language: system
        types: [file]
        files: \.[jt]sx?$  # *.js, *.jsx, *.ts, *.tsx
      - id: typecheck
        name: typecheck
        description: Проверка типов TypeScript при помощи tsc
        entry: npm run typecheck
        language: system
        types: [file]
        files: \.[jt]sx?$
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        description: Проверка Markdown файлов при помощи markdownlint
        entry: npm run markdownlint
        language: system
        types: [file]
        files: \.(md|markdown)$
      - id: djlint
        name: djlint
        description: Проверка HTML-шаблонов при помощи djlint
        entry: uv run --no-sync djlint
        language: system
        types: [html]
      - id: mypy
        name: mypy
        description: Выполнить проверки типов при помощи Mypy
        entry: uv run --no-sync mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-export
        name: uv-export
        description: Экспорт зависимостей в requirements.txt
        entry: uv export --format requirements-txt --no-hashes --output-file requirements.txt
        language: system
        pass_filenames: false
        files: ^uv\.lock$
      - id: schema-export
        name: schema-export
        description: Перегенерация OpenAPI-схемы бэкенда
        entry: uv run --no-sync python backend/manage.py spectacular --file docs/schemas/openapi.yaml
        language: system
        pass_filenames: false
        files: ^backend/
      - id: schema-export-check
        name: schema-export-check
        description: Проверка актуальности OpenAPI-схемы бэкенда
        entry: git diff --exit-code -- docs/schemas/openapi.yaml
        language: system
        pass_filenames: false
        files: ^backend/
      - id: api-types
        name: api-types
        description: Перегенерация типов API фронтенда
        entry: npm run api-types
        language: system
        pass_filenames: false
        files: ^docs/schemas/openapi\.yaml$
      - id: api-types-check
        name: api-types-check
        description: Проверка актуальности типов API фронтенда
        entry: git diff --exit-code -- frontend/src/types/api-schema.ts
        language: system
        pass_filenames: false
        files: ^docs/schemas/openapi\.yaml$
