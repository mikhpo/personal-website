version: '3'

dotenv: ['.env']

vars:
  COMPOSE_CMD:
    sh: docker compose version >/dev/null 2>&1 && echo "docker compose" || echo "docker-compose"
  # Флаг --wait поддерживается Docker Compose V2; для V1 подставляется пустое значение.
  COMPOSE_WAIT:
    sh: docker compose version >/dev/null 2>&1 && echo "--wait" || echo ""

tasks:
  commit:
    desc: Зафиксировать и отправить изменения в удаленный репозиторий
    summary: |
      Команда вызывает Bash-скрипт для подготовки, выполнения и отправки коммита в удаленный репозиторий Git.
      При вызове команды можно передать сообщение для коммита через аргумент командной строки.
      Пример использования с аргументом: `task commit -- "Commit message"`
      Пример использования без аргумента: `task commit`
    cmds:
      - bash ./tools/commit.sh {{.CLI_ARGS}}

  checkout:
    desc: Переключиться на ветку из удаленного репозитория
    summary: |
      Команда вызывает Bash-скрипт для создания локальной отслеживающей ветки для удалённой ветки.
      При вызове команды можно передать имя ветки через аргумент командной строки.
      Если имя ветки не передано, то будет запрошено у пользователя.
      Пример использования с аргументом: `task checkout -- "branch-name"`
      Пример использования без аргумента: `task checkout`
    cmds:
      - bash ./tools/checkout.sh {{.CLI_ARGS}}

  runserver:
    desc: Запустить сервер приложения
    summary: |
      Запускает сервер приложения Django. Альтернатива команде `python manage.py runserver`.
      Интерпретатор Python запускается через Poetry из виртуального окружения проекта.
      Перед запуском сервера применяются миграции базы данных и собираются статические файлы.
      Сервер PostgreSQL запускается в контейнере через Docker Compose.
    preconditions:
      - test -f compose.yaml
      - test -f .env
    env:
      POSTGRES_HOST: localhost
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"
      - poetry run python ./backend/manage.py migrate
      - poetry run python ./backend/manage.py collectstatic --noinput
      - poetry run python ./backend/manage.py runserver

  migrate:
    desc: Подготовить и выполнить миграции, экспортировать новые диаграммы моделей
    summary: |
      Проверить изменения во всех моделях, сгенерировать миграции,
      применить миграции к базе данных и экспортировать актуальные диаграммы моделей.
    preconditions:
      - test -f compose.yaml
      - test -f .env
    env:
      POSTGRES_HOST: localhost
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"
      - poetry run python ./backend/manage.py makemigrations
      - poetry run python ./backend/manage.py migrate
      - task: graph-models

  test-frontend:
    desc: Выполнить модульные тесты React компонентов с проверкой покрытия кода
    summary: |
      Команда устанавливает зависимости Node.js и запускает Jest тесты для React компонентов.
      Включает генерацию отчета о покрытии кода тестами.
      Используется при локальной разработке и в CI/CD для проверки качества фронтенда.
    preconditions:
      - test -f package.json
    cmds:
      - npm ci
      - npm test -- --coverage --watchAll=false

  build-frontend:
    desc: Собрать React фронтенд в production-ready бандл
    summary: |
      Команда устанавливает зависимости Node.js и выполняет production сборку React приложения.
      Результатом является оптимизированный бандл и файл webpack-stats.json,
      необходимый для интеграции с Django через django-webpack-loader.
    preconditions:
      - test -f package.json
    cmds:
      - npm ci
      - npm run build

  test-backend:
    desc: Выполнить тесты Django с использованием собранного React фронтенда
    summary: |
      Команда запускает Django тесты с отключенным кэшем webpack-loader.
      Перед запуском тестов выполняет сборку фронтенда для обеспечения актуального состояния бандлов.
      Используется для проверки интеграции React компонентов с Django шаблонами.
    preconditions:
      - test -f compose.yaml
      - test -f pyproject.toml
      - test -f .env
    env:
      POSTGRES_HOST: localhost
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
      WEBPACK_LOADER_CACHE: 'False'
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"
      - task: build-frontend
      - poetry run pytest {{.CLI_ARGS}}

  test:
    desc: Выполнить полный цикл тестирования приложения (фронтенд + бэкенд)
    summary: |
      Команда выполняет полный цикл тестирования, включающий как фронтенд, так и бэкенд.
      Сначала запускает тесты React компонентов, затем тестирует интеграцию с Django.
      Используется для финальной проверки перед коммитом и в CI/CD пайплайне.
    preconditions:
      - test -f compose.yaml
      - test -f pyproject.toml
      - test -f package.json
      - test -f .env
    env:
      POSTGRES_HOST: localhost
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"
      - task: test-frontend
      - task: test-backend

  test-container:
    desc: Выполнить тесты в контейнере
    summary: |
      Команда выполняет в контейнере тесты проекта Python/Django через Pytest и тесты вспомогательных модулей Node.js.
      Сервер базы данных PostgreSQL запускается в контейнере через Docker Compose.
    preconditions:
      - test -f compose.yaml
      - test -f pyproject.toml
      - test -f .env
    env:
      POSTGRES_HOST: postgres
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d application postgres"
      - "{{.COMPOSE_CMD}} ps"
      - "{{.COMPOSE_CMD}} exec application npm test"
      - "{{.COMPOSE_CMD}} exec application poetry run pytest {{.CLI_ARGS}}"

  dev-cert:
    desc: Выпустить self-signed сертификат локального стека nginx
    summary: |
      Команда создает сертификат для контейнерного nginx локального стека
      (DOMAIN_NAME из .env, по умолчанию localhost): до первого выпуска
      сертификата nginx не стартует. Сертификат попадает в
      nginx/letsencrypt/live/<домен>/ - тот же путь, что использует certbot
      в продакшене, поэтому конфигурация nginx одна для всех сред.
    preconditions:
      - test -f compose.yaml
    cmds:
      - mkdir -p nginx/letsencrypt/live/{{.DOMAIN_NAME | default "localhost"}}
      - openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -subj "/CN={{.DOMAIN_NAME | default "localhost"}}"
        -keyout nginx/letsencrypt/live/{{.DOMAIN_NAME | default "localhost"}}/privkey.pem
        -out nginx/letsencrypt/live/{{.DOMAIN_NAME | default "localhost"}}/fullchain.pem

  test-integration:
    desc: Выполнить интеграционные тесты
    summary: |
      Команда выполняет только интеграционные тесты из папки tests в корневом каталоге
      проекта через Pytest. Интерпретатор Python запускается через Poetry из виртуального
      окружения проекта. Сервисы поднимаются в контейнерах Docker через Compose;
      флаг --wait дожидается прохождения healthcheck всех сервисов (применяется
      при использовании Docker Compose V2), чтобы тесты не стартовали раньше
      готовности приложения. Для nginx предварительно выпускается self-signed
      сертификат локального стека (задача dev-cert).
    preconditions:
      - test -f compose.yaml
      - test -f pyproject.toml
      - test -f .env
    env:
      POSTGRES_HOST: postgres
      DOMAIN_NAME: '{{.DOMAIN_NAME | default "localhost"}}'
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    cmds:
      - task: dev-cert
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d {{.COMPOSE_WAIT}} application postgres nginx minio"
      - "{{.COMPOSE_CMD}} ps"
      - poetry run pytest ./tests {{.CLI_ARGS}}

  ruff:
    desc: Выполнить статический анализ кода при помощи утилиты Ruff
    summary: Команда запускает проверки Ruff с автоматически исправлением ошибок
    preconditions:
      - test -f pyproject.toml
    cmds:
      - poetry run ruff check --fix

  mypy:
    desc: Выполнить статический анализ кода при помощи утилиты Mypy
    summary: Команда запускает проверки типов Mypy
    preconditions:
      - test -f pyproject.toml
    cmds:
      - poetry run mypy .

  eslint:
    desc: Выполнить статический анализ кода JavaScript/React при помощи ESLint
    summary: |
      Проверяет качество кода JavaScript и React компонентов с помощью ESLint.
      Использует конфигурацию из .eslintrc.json.
    preconditions:
      - test -f package.json
    cmds:
      - npm run eslint

  markdownlint:
    desc: Выполнить проверку Markdown файлов при помощи markdownlint
    summary: |
      Проверяет качество Markdown документации с помощью markdownlint.
      Использует конфигурацию из .markdownlint.json.
    preconditions:
      - test -f package.json
    cmds:
      - npm run markdownlint

  check:
    desc: Выполнить статический анализ кода и проверки Django
    summary: Команда запускает проверки Ruff, Mypy, ESLint, markdownlint и Django
    preconditions:
      - test -f pyproject.toml
      - test -f package.json
    cmds:
      - task: ruff
      - task: mypy
      - task: eslint
      - task: markdownlint
      - poetry run python backend/manage.py check

  install:
    desc: Установить зависимости Python и Node.js
    summary: |
      Выполняет установку зависимостей Python при помощи Poetry и зависимостей Node.js при помощи npm.
      Списки зависимостей считываются из файлов pyproject.toml и package.json.
    preconditions:
      - test -f pyproject.toml
      - test -f package.json
    cmds:
      - poetry install
      - npm install

  update:
    desc: Обновить версии зависимостей Python и Node.js
    summary: |
      Обновляет до последних допустимых версий пакеты Python
      при помощи плагина poetry-plugin-up и
      зависимости Node.js при помощи npm.
    preconditions:
        - test -f pyproject.toml
        - test -f package.json
    cmds:
      - poetry up --latest
      - npm update

  build:
    desc: Выполнить сборку образов контейнеров
    summary: |
      Выполняет сборку контейнеров Docker для сервисов приложения и Nginx, определенных в файле compose.yaml.
      Инструкции по сборке образов определены в файлах Dockerfile для каждого сервиса.
    preconditions:
      - test -f compose.yaml
      - test -f .env
    cmds:
      - "{{.COMPOSE_CMD}} build"

  up-detached:
    desc: Запустить контейнеры в фоновом режиме
    summary: |
      Запускает контейнеры Docker сервисов, определенных в файле Compose, в фоновом режиме (detached).
      Поднимается типовой набор для локальной разработки: приложение и PostgreSQL.
      MinIO и nginx подключаются профилями (COMPOSE_PROFILES в .env) или явным
      указанием имени сервиса.
      Флаг --wait блокирует выполнение до прохождения healthcheck всех сервисов
      (применяется при использовании Docker Compose V2).
    preconditions:
      - test -f compose.yaml
      - test -f .env
    cmds:
      - "{{.COMPOSE_CMD}} up -d {{.COMPOSE_WAIT}} application postgres"
      - "{{.COMPOSE_CMD}} ps"

  restart:
    desc: Перезапускает контейнеры сервисов
    summary: |
      Пересоздает и перезапускает контейнеры Docker сервисов, определенных в файле Compose,
      в фоновом режиме (detached). Полезно в случае изменений переменных окружения.
      Набор сервисов определяется активными профилями COMPOSE_PROFILES из файла .env.
      Флаг --wait блокирует выполнение до прохождения healthcheck всех сервисов
      (применяется при использовании Docker Compose V2).
    preconditions:
      - test -f compose.yaml
      - test -f .env
    cmds:
      - "{{.COMPOSE_CMD}} up --detach --force-recreate {{.COMPOSE_WAIT}}"
      - "{{.COMPOSE_CMD}} ps"

  watch:
    desc: Запустить контейнеры в фоновом режиме и отслеживать изменения кода
    summary: |
      Запускает контейнеры Docker в фоновом режиме и пересоздает контейнеры в случае изменений при помощи Compose Watch.
      Поднимается типовой набор для локальной разработки: приложение и PostgreSQL;
      дополнительные сервисы подключаются профилями из COMPOSE_PROFILES в .env.
      Флаг --wait дожидается прохождения healthcheck (применяется при использовании Docker Compose V2).
    preconditions:
      - test -f compose.yaml
      - test -f .env
    env:
      POSTGRES_HOST: postgres
      MINIO_SERVER_URL: http://minio:9000
      MINIO_BROWSER_REDIRECT_URL: http://minio:9001
    cmds:
      - "{{.COMPOSE_CMD}} --profile postgres up -d {{.COMPOSE_WAIT}}"
      - "{{.COMPOSE_CMD}} ps"
      - "{{.COMPOSE_CMD}} watch"

  down:
    desc: Остановить контейнеры и удалить остановленные контейнеры, тома и сети
    summary: |
      Аналог команды `docker compose down`: останавливает запущенные контейнеры, удаляет контейнеры, тома и сети.
    preconditions:
      - test -f compose.yaml
    cmds:
      - "{{.COMPOSE_CMD}} down --remove-orphans --volumes"

  postgres:
    desc: Запустить контейнер PostgreSQL
    summary: |
      Запускает контейнер сервиса PostgreSQL, определенного в файле Compose, в фоновом режиме (detached).
    preconditions:
      - test -f compose.yaml
      - test -f .env
    cmds:
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"

  minio-alias:
    desc: Создать алиас для сервера MinIO
    summary: |
      Создает алиас сервера S3 для клиента MinIO (mc). Значения считываются из переменных окружения.
    preconditions:
      - test -f compose.yaml
      - test -f .env
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d minio"
      - "{{.COMPOSE_CMD}} ps"
      - mc alias set ${MINIO_ALIAS} ${MINIO_SERVER_URL} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      - mc admin info ${MINIO_ALIAS}

  delete-branches:
    desc: Удалить все ветки, кроме основной
    summary: |
      Выполняет команду `git branch -D` для всех веток, кроме main и текущей.
    cmds:
      - git branch | grep -v "main" | xargs git branch -D

  sync-branch:
    desc: Синхронизировать ветку между репозиториями github и sourcecraft
    summary: |
      Синхронизирует ветку между репозиториями github и sourcecraft.
      Если имя ветки не передано, то будет использована ветка main.
      Пример использования с аргументом: `task sync-branch -- "branch-name"`
      Пример использования без аргумента: `task sync-branch`
    cmds:
      - bash ./tools/sync-branch.sh {{.CLI_ARGS}}

  graph-models:
    desc: Экспортировать диаграммы моделей проекта
    summary: |
      Выполняет команду grap_models из пакета django-extensions для всего проекта,
      приложений проекта в совокупности и каждого приложения в отдельности.
    cmds:
      - bash ./tools/graph-models.sh

  render-diagrams:
    desc: Экспортировать архитектурные C4-диаграммы из PlantUML исходников
    summary: |
      Выполняет рендер файлов .puml из каталога docs/diagrams/src в формат SVG.
      Результат помещается в docs/diagrams/out/<имя>/<имя>.svg.
      Для работы требуется установленная утилита PlantUML (brew install plantuml).
    cmds:
      - bash ./tools/render-diagrams.sh

  check-migrations:
    desc: Проверить проект на отсутствующие миграции
    summary: |
      Проверить, что отсутствуют изменения в моделях, для которых не подготовлено миграций.
      Выполняет команду makemigrations с аргументами --dry-run и --check.
      Возвращает не нулевой код ответа в случае отсутствия миграций.
    preconditions:
      - test -f pyproject.toml
      - test -f compose.yaml
      - test -f .env
    env:
      POSTGRES_HOST: localhost
    cmds:
      - defer: "{{.COMPOSE_CMD}} down"
      - "{{.COMPOSE_CMD}} up -d postgres"
      - "{{.COMPOSE_CMD}} ps"
      - poetry run python backend/manage.py makemigrations --dry-run --check

  clean-cache:
    desc: Удалить файлы кэша
    summary: |
      Удаляет все папки __pycache__ и файлы c расширением .pyc из дерева каталогов проекта.
    cmds:
      - find . | grep -E "(/__pycache__$|\.pyc$|\.pyo$)" | xargs rm -rf

  stop-containers:
    desc: Остановить все запущенные контейнеры
    summary: |
      Эквивалент команды docker stop для всех запущенных в данный момент контейнеров (docker ps -a).
    cmds:
      - docker ps -a
      - docker stop $(docker ps -a -q) 2>/dev/null || true
      - docker ps -a

  remove-containers:
    desc: Остановить все запущенные контейнеры
    summary: |
      Эквивалент команды docker rm для всех запущенных в данный момент контейнеров (docker ps -a).
    cmds:
      - docker ps -a
      - docker stop $(docker ps -a -q) 2>/dev/null || true
      - docker rm $(docker ps -a -q) 2>/dev/null || true
      - docker ps -a

  prune-volumes:
    desc: Удалить все тома Docker
    summary: |
      Удаляет все тома Docker, включая именованные.
      Перед удалением останавливает все контейнеры.
      Полезно для полной очистки данных контейнеров.
    cmds:
      - docker volume ls
      - task: stop-containers
      - docker volume rm -f $(docker volume ls -q) 2>/dev/null || true
      - docker volume ls

  pre-commit:
    desc: Выполнить pre-commit хуки
    summary: |
      Запускает pre-commit хуки для проверки кода перед коммитом.
      Автоматически применяет форматирование и проверяет код.
      Проверяет все файлы проекта.
    preconditions:
      - test -f .pre-commit-config.yaml
      - test -f pyproject.toml
    cmds:
      - pre-commit run --all-files
