[project]
name = "personal-website"
version = "0.1.0"
description = "My personal website"
authors = [{ name = "Mikhail Polyakov", email = "mikhpo@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.123",
    "crispy-bootstrap5>=2026.9",
    "django>=6.1.2",
    "django-admin-sortable2>=2.3.1",
    "django-auditlog>=3.4.1",
    "django-cleanup>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-crispy-forms>=2.7",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-imagekit>=6.1.1",
    "django-storages>=1.14.6",
    "django-tinymce>=5.0.0",
    "django-webpack-loader>=3.2.4",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "factory-boy>=3.3.3",
    "faker>=40.44.0",
    "faker-file>=0.19.1",
    "gunicorn>=26.2.0",
    "huey[postgres,stats]>=3.5.3",
    "inflection>=0.5.1",
    "jsonschema>=4.26.0",
    "model-bakery>=1.24.2",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pytils>=0.4.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "s3path>=0.6.5",
    "uritemplate>=4.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "coverage>=7.17.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "djlint>=1.49.1",
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pyclean>=3.7.0",
    "pydot>=4.0.1",
    "pyparsing>=3.3.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "pytest-subtests>=0.15.0",
    "ruff>=0.17.3",
    "types-django-filter>=26.2.0.20261005",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"
src_paths = ["backend", "tests"]

[tool.ruff]
line-length = 120
unsafe-fixes = true
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    # Личный проект: копирайт-заголовки в исходных файлах не ведутся
    "CPY001",
    "D205",
    "D206",
    "DJ007",
    "FA100",
    "FA102",
    "G004",
    "PT009",
    "PT027",
    "RUF001",
    "RUF002",
    "RUF003",
    "S308",
    "TC002",
    "TC003",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"] # __init__.py могут быть пустыми
"**/migrations/**.py" = [
    "ANN001",
    "ANN201",
    "ARG001",
    "D100",
    "D101",
    "RUF012",
] # файлы миграций создаются модулем Django
"**/tests/**.py" = [
    "S101", # юнит-тесты проверяют условия assert'ом
    "S105",
    "S106",
    "S108",
    "S311",
    "S501",
    "S603",
    "S607"
]
"**/signals.py" = ["ANN401", "ARG001"]
"tools/*.py" = [
    "S603", # утилиты вызывают системные команды (git) с литеральными аргументами
]
".agents/skills/*/scripts/*.py" = [
    "S603", # скрипты внешних скиллов вызывают git с литеральными аргументами
]

[tool.ruff.lint.pydocstyle]
convention = "pep257" # Варианты: "google", "numpy", "pep257".

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.djlint]
profile = "django"
# H021 - inline-стили обязательны для email-шаблонов: почтовые клиенты
# вырезают блоки <style>, поэтому стили дублируются в атрибутах тегов
ignore = "H006,H013,H021"

[tool.pytest.ini_options]
markers = [
    "integration: метка для интеграционных тестов, требующих внешние сервисы",
]
pythonpath = "backend"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
DJANGO_SETTINGS_MODULE = "personal_website.settings"
testpaths = ["backend"]
addopts = "--cov=backend --cov-report term-missing:skip-covered --cov-report html -m 'not integration'"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/__init__.py",
    "*/migrations/*",
    "manage.py",
    "wsgi.py",
    "asgi.py",
    "runners.py",
]

[tool.mypy]
exclude = ["venv", ".venv", "static", "plans"]
disable_error_code = ["attr-defined", "var-annotated", "misc"]

[[tool.mypy.overrides]]
# Сторонние библиотеки, используемые проектом напрямую и поставляемые
# без аннотаций типов.
module = [
    "auditlog.*",
    "boto3.*",
    "botocore.*",
    "django.tasks.*",
    "imagekit.*",
    "requests.*",
    "whitenoise.*",
]
ignore_missing_imports = true
