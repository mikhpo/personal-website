[project]
name = "personal-website"
version = "0.1.0"
description = "My personal website"
authors = [{ name = "Mikhail Polyakov", email = "mikhpo@outlook.com" }]
dynamic = ["requires-python", "dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^6.0.2"
django-tinymce = "^5.0.0"
django-cleanup = "^9.0.0"
django-imagekit = "^6.0.0"
django-admin-sortable2 = "^2.3.1"
django-extensions = "^4.1"
django-crispy-forms = "^2.5"
crispy-bootstrap5 = "^2025.6"
whitenoise = "^6.11.0"
gunicorn = "^25.1.0"
python-dotenv = "^1.2.1"
pytils = "^0.4.4"
pillow = "^12.1.1"
psycopg = { extras = ["binary"], version = "^3.3.2" }
faker = "^40.4.0"
faker-file = "^0.18.4"
model-bakery = "^1.23.3"
requests = "^2.32.5"
minio = "^7.2.20"
factory-boy = "^3.3.3"
pydantic = "^2.12.5"
django-storages = "^1.14.6"
boto3 = "^1.42.49"
s3path = "^0.6.5"
django-webpack-loader = "^3.2.3"
djangorestframework = "^3.16.1"
django-cors-headers = "^4.9.0"
djangorestframework-simplejwt = "^5.5.1"
django-filter = "^25.2"
drf-spectacular = "^0.29.0"
pyyaml = "^6.0.3"
uritemplate = "^4.2.0"
inflection = "^0.5.1"
jsonschema = "^4.26.0"
drf-spectacular-sidecar = "^2026.1.1"

[tool.poetry.group.dev.dependencies]
coverage = "^7.13.4"
black = "^26.1.0"
isort = "^7.0.0"
djlint = "^1.36.4"
pytest = "^9.0.2"
pytest-subtests = "^0.15.0"
pytest-django = "^4.11.1"
pytest-cov = "^7.0.0"
pyclean = "^3.5.0"
pre-commit = "^4.5.1"
ruff = "^0.15.1"
pyparsing = "^3.3.2"
pydot = "^4.0.1"
django-stubs = { extras = ["compatible-mypy"], version = "^5.2.9" }
types-requests = "^2.32.4.20260107"
pytest-playwright = "^0.7.2"
djangorestframework-stubs = "^3.16.8"
types-django-filter = "^25.2.0.20260213"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"
src_paths = ["backend", "tests"]

[tool.ruff]
line-length = 120
unsafe-fixes = true
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "D205",
    "D206",
    "DJ007",
    "FA100",
    "FA102",
    "G004",
    "PT009",
    "PT027",
    "RUF001",
    "RUF002",
    "RUF003",
    "S308",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"] # __init__.py могут быть пустыми
"**/migrations/**.py" = [
    "ANN001",
    "ANN201",
    "ARG001",
    "D100",
    "D101",
    "RUF012",
] # файлы миграций создаются модулем Django
"**/tests/**.py" = [
    "S105",
    "S106",
    "S311",
    "S501",
] # интеграционные тесты: допустимы фиксированные пароли и отключение проверки self-signed сертификата
"**/signals.py" = ["ANN401", "ARG001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257" # Варианты: "google", "numpy", "pep257".

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.djlint]
ignore = "H006,H013"

[tool.pytest.ini_options]
markers = [
    "integration: метка для интеграционных тестов, требующих внешние сервисы",
]
pythonpath = "backend"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
DJANGO_SETTINGS_MODULE = "personal_website.settings"
testpaths = ["backend"]
addopts = "--cov=backend --cov-report term-missing:skip-covered --cov-report html -m 'not integration'"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/__init__.py",
    "*/migrations/*",
    "manage.py",
    "wsgi.py",
    "asgi.py",
    "runners.py",
]

[tool.mypy]
exclude = ["venv", ".venv", "static"]
disable_error_code = ["attr-defined", "var-annotated", "misc"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
