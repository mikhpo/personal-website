[project]
name = "personal-website"
version = "0.1.0"
description = "My personal website"
authors = [{ name = "Mikhail Polyakov", email = "mikhpo@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0.2,<7.0",
    "django-tinymce>=5.0.0,<6.0",
    "django-cleanup>=9.0.0,<10.0",
    "django-imagekit>=6.0.0,<7.0",
    "django-admin-sortable2>=2.3.1,<3.0",
    "django-extensions>=4.1,<5.0",
    "django-crispy-forms>=2.5,<3.0",
    "crispy-bootstrap5>=2025.6,<2026.0",
    "whitenoise>=6.11.0,<7.0",
    "gunicorn>=25.1.0,<26.0",
    "python-dotenv>=1.2.1,<2.0",
    "pytils>=0.4.4,<0.5",
    "pillow>=12.1.1,<13.0",
    "psycopg[binary]>=3.3.2,<4.0",
    "faker>=40.4.0,<41.0",
    "faker-file>=0.18.4,<0.19",
    "model-bakery>=1.23.3,<2.0",
    "requests>=2.32.5,<3.0",
    "factory-boy>=3.3.3,<4.0",
    "pydantic>=2.12.5,<3.0",
    "django-storages>=1.14.6,<2.0",
    "boto3>=1.42.49,<2.0",
    "s3path>=0.6.5,<0.7",
    "django-webpack-loader>=3.2.3,<4.0",
    "djangorestframework>=3.16.1,<4.0",
    "django-cors-headers>=4.9.0,<5.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0",
    "django-filter>=25.2,<26.0",
    "drf-spectacular>=0.29.0,<0.30",
    "pyyaml>=6.0.3,<7.0",
    "uritemplate>=4.2.0,<5.0",
    "inflection>=0.5.1,<0.6",
    "jsonschema>=4.26.0,<5.0",
    "drf-spectacular-sidecar>=2026.1.1,<2027.0",
    "django-auditlog>=3.4.1,<4.0",
    "huey[postgres,stats]>=3.4.0,<4.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4,<8.0",
    "black>=26.1.0,<27.0",
    "isort>=7.0.0,<8.0",
    "djlint>=1.36.4,<2.0",
    "pytest>=9.0.2,<10.0",
    "pytest-subtests>=0.15.0,<0.16",
    "pytest-django>=4.11.1,<5.0",
    "pytest-cov>=7.0.0,<8.0",
    "pyclean>=3.5.0,<4.0",
    "pre-commit>=4.5.1,<5.0",
    "ruff>=0.15.1,<0.16",
    "pyparsing>=3.3.2,<4.0",
    "pydot>=4.0.1,<5.0",
    "django-stubs[compatible-mypy]>=5.2.9,<6.0",
    "types-requests>=2.32.4.20260107,<3.0",
    "pytest-playwright>=0.7.2,<0.8",
    "djangorestframework-stubs>=3.16.8,<4.0",
    "types-django-filter>=25.2.0.20260213,<26.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"
src_paths = ["backend", "tests"]

[tool.ruff]
line-length = 120
unsafe-fixes = true
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "D205",
    "D206",
    "DJ007",
    "FA100",
    "FA102",
    "G004",
    "PT009",
    "PT027",
    "RUF001",
    "RUF002",
    "RUF003",
    "S308",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"] # __init__.py могут быть пустыми
"**/migrations/**.py" = [
    "ANN001",
    "ANN201",
    "ARG001",
    "D100",
    "D101",
    "RUF012",
] # файлы миграций создаются модулем Django
"**/tests/**.py" = [
    "S101", # юнит-тесты проверяют условия assert'ом
    "S105",
    "S106",
    "S108",
    "S311",
    "S501",
    "S603",
    "S607"
]
"**/signals.py" = ["ANN401", "ARG001"]
"tools/*.py" = [
    "S603", # утилиты вызывают системные команды (git) с литеральными аргументами
]

[tool.ruff.lint.pydocstyle]
convention = "pep257" # Варианты: "google", "numpy", "pep257".

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.djlint]
profile = "django"
# H021 - inline-стили обязательны для email-шаблонов: почтовые клиенты
# вырезают блоки <style>, поэтому стили дублируются в атрибутах тегов
ignore = "H006,H013,H021"

[tool.pytest.ini_options]
markers = [
    "integration: метка для интеграционных тестов, требующих внешние сервисы",
]
pythonpath = "backend"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
DJANGO_SETTINGS_MODULE = "personal_website.settings"
testpaths = ["backend"]
addopts = "--cov=backend --cov-report term-missing:skip-covered --cov-report html -m 'not integration'"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/__init__.py",
    "*/migrations/*",
    "manage.py",
    "wsgi.py",
    "asgi.py",
    "runners.py",
]

[tool.mypy]
exclude = ["venv", ".venv", "static", "plans"]
disable_error_code = ["attr-defined", "var-annotated", "misc"]

[[tool.mypy.overrides]]
# Сторонние библиотеки, используемые проектом напрямую и поставляемые
# без аннотаций типов.
module = [
    "auditlog.*",
    "boto3.*",
    "botocore.*",
    "django.tasks.*",
    "imagekit.*",
    "requests.*",
    "whitenoise.*",
]
ignore_missing_imports = true
