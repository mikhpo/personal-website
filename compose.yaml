# Общая конфигурация логирования для всех сервисов.
# Docker собирает stdout/stderr контейнеров в driver json-file
# с ротацией по размеру: не более 3 файлов по 10 МБ на контейнер.
# Детальные логи приложения дополнительно пишутся в volume (см. сервис website).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Веб-сайт на Django. Запускается либо через Gunicorn, либо через команду runserver.
  # Способ запуска и параметры запуска определяются скриптом entrypoint.sh.
  website:
    image: ${DOCKER_REGISTRY:-docker.io}/mikhpo/personal-website:latest
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: ./Dockerfile
      tags:
        - mikhpo/personal-website:latest
        - ghcr.io/mikhpo/personal-website:latest
      platforms:
        - "linux/amd64"
    environment:
      - STORAGE_ROOT=/srv/website/storage
      - STATIC_ROOT=/srv/website/static
      - BACKUP_ROOT=/srv/website/backups
      - LOGS_ROOT=/srv/website/logs
      - TEMP_ROOT=/srv/website/temp
    env_file: .env
    # Порты не публикуются: трафик терминирует Traefik во внутренней сети Compose.
    # Публикация порта приложения наружу не нужна и обходит правила файрвола хоста.
    volumes:
      - ${STORAGE_ROOT:-./storage/}:/srv/website/storage:rw
      - ${STATIC_ROOT:-./static/}:/srv/website/static:rw
      - ${BACKUP_ROOT:-./backups/}:/srv/website/backups:rw
      - ${LOGS_ROOT:-./logs/}:/srv/website/logs:rw
      - ${TEMP_ROOT:-./temp/}:/srv/website/temp:rw
      - ./htmlcov/:/srv/website/htmlcov:rw
      # SSL-сертификат PostgreSQL.
      # Source: путь на хосте (POSTGRES_SSL_CERT_HOST_PATH, либо POSTGRES_SSL_ROOT_CERT_PATH).
      # Target: путь в контейнере, который читает Django (POSTGRES_SSL_ROOT_CERT_PATH).
      - type: bind
        source: ${POSTGRES_SSL_CERT_HOST_PATH:-${POSTGRES_SSL_ROOT_CERT_PATH:-/root/.postgresql/root.crt}}
        target: ${POSTGRES_SSL_ROOT_CERT_PATH:-/root/.postgresql/root.crt}
        read_only: true
    labels:
      - "traefik.enable=true"
      # Маршрутизация по доменам основного и www-хоста.
      - "traefik.http.routers.website.rule=Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      # TLS включается всегда; в dev-режиме используется встроенный
      # self-signed сертификат Traefik.
      - "traefik.http.routers.website.tls=true"
      # Certresolver подключается только непустым значением переменной
      # TRAEFIK_CERT_RESOLVER (прод: le). Пустое значение в dev-среде
      # оставляет ACME-клиент пассивным - выпуск сертификатов не выполняется.
      - "traefik.http.routers.website.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.services.website.loadbalancer.server.port=${DJANGO_PORT:-8000}"
    # Порядок запуска относительно PostgreSQL и MinIO не задаётся через depends_on:
    # эти сервисы относятся к профилю dev и могут отсутствовать в текущем окружении,
    # поэтому готовность ожидается скриптом entrypoint.sh (функция wait_for_port).
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: .

  # Обратный прокси-сервер Traefik. Обслуживает HTTPS: сертификаты
  # Let's Encrypt получаются и обновляются автоматически.
  # Приложение обнаруживается по Docker-лейблам.
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Встроенный health-endpoint для команды `traefik healthcheck --ping`
      # (порт 8080 наружу не публикуется).
      - "--ping=true"
    ports:
      - ${NGINX_PORT:-80}:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Состояние ACME-клиента (аккаунт, сертификаты) хранится на хосте:
      # bind-mount не удаляется командой docker compose down -v
      # и переносится между серверами целиком.
      - ./traefik/letsencrypt:/letsencrypt
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Кластер PostgreSQL для веб-сайта. База данных создается автоматически.
  # Сервис предназначен для окружений, где база данных не предоставляется
  # внешним сервисом. Поднимается при активном профиле dev
  # (флаг --profile dev или переменная COMPOSE_PROFILES).
  postgres:
    profiles: ["dev"]
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file: .env
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-совместимое объектное хранилище Minio. Предназначено для окружений,
  # где объектное хранилище не предоставляется внешним сервисом.
  # Поднимается при активном профиле dev (флаг --profile dev или
  # переменная COMPOSE_PROFILES).
  minio:
    profiles: ["dev"]
    image: minio/minio
    command: minio server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    env_file: .env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data:rw
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
