# Общая конфигурация логирования для всех сервисов.
# Docker собирает stdout/stderr контейнеров в driver json-file
# с ротацией по размеру: не более 3 файлов по 10 МБ на контейнер.
# Детальные логи приложения дополнительно пишутся в volume (см. сервис application).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Инфраструктурные сервисы подключаются собственными профилями:
# postgres, minio, nginx (обратный прокси с раздачей медиа
# filesystem-хранилища). Пустое значение COMPOSE_PROFILES означает,
# что все инфраструктурные сервисы внешние (managed-БД, удаленное S3,
# хостовый обратный прокси), и поднимается только приложение.
services:
  # Веб-сайт на Django. Запускается либо через Gunicorn, либо через команду runserver.
  # Способ запуска и параметры запуска определяются скриптом entrypoint.sh.
  application:
    image: ${DOCKER_REGISTRY:-docker.io}/mikhpo/personal_website:latest
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: ./Dockerfile
      tags:
        - mikhpo/personal_website:latest
        - ghcr.io/mikhpo/personal-website:latest
      platforms:
        - "linux/amd64"
    environment:
      - STORAGE_ROOT=/srv/website/storage
      - STATIC_ROOT=/srv/website/static
      - BACKUP_ROOT=/srv/website/backups
      - LOGS_ROOT=/srv/website/logs
      - TEMP_ROOT=/srv/website/temp
    env_file: .env
    # Порт приложения публикуется постоянно, но только на localhost хоста:
    # этого требует хостовый обратный прокси (nginx) при внешних БД и хранилище.
    # При контейнерном nginx публикация безвредна: прокси обращается
    # к приложению по внутренней сети Compose, а порт недоступен с других
    # хостов. Контейнерный порт равен хостовому: приложение внутри контейнера
    # слушает тот же DJANGO_PORT (entrypoint.sh), поэтому обе стороны
    # публикации следуют переменной одинаково.
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8000}:${DJANGO_PORT:-8000}"
    # Доступ к сервисам операционной системы хоста (systemd-PostgreSQL,
    # хостовый nginx) с Linux: имя host.docker.internal на Linux из коробки
    # не разрешается без этой записи.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${STORAGE_ROOT:-./storage/}:/srv/website/storage:rw
      - ${STATIC_ROOT:-./static/}:/srv/website/static:rw
      - ${BACKUP_ROOT:-./backups/}:/srv/website/backups:rw
      - ${LOGS_ROOT:-./logs/}:/srv/website/logs:rw
      - ${TEMP_ROOT:-./temp/}:/srv/website/temp:rw
      - ./htmlcov/:/srv/website/htmlcov:rw
      # SSL-сертификат PostgreSQL.
      # Source: путь на хосте (POSTGRES_SSL_CERT_HOST_PATH, либо POSTGRES_SSL_ROOT_CERT_PATH).
      # Target: путь в контейнере, который читает Django (POSTGRES_SSL_ROOT_CERT_PATH).
      - type: bind
        source: ${POSTGRES_SSL_CERT_HOST_PATH:-${POSTGRES_SSL_ROOT_CERT_PATH:-/root/.postgresql/root.crt}}
        target: ${POSTGRES_SSL_ROOT_CERT_PATH:-/root/.postgresql/root.crt}
        read_only: true
    # Порядок запуска относительно PostgreSQL и MinIO не задаётся через depends_on:
    # эти сервисы относятся к собственным профилям (postgres, minio) и могут
    # отсутствовать в текущем окружении, поэтому готовность ожидается скриптом
    # entrypoint.sh (функция wait_for_port).
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DJANGO_PORT:-8000}/health/"]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: .

  # Обратный прокси nginx: терминирование TLS, проксирование приложения
  # и раздача медиа filesystem-хранилища напрямую с диска (location /media/,
  # каталог хранилища монтируется в прокси read-only - запросы медиа
  # не нагружают воркеры приложения). Конфигурация рендерится официальным
  # образом из шаблона nginx/personal-website.conf.template (envsubst
  # только по переменным окружения; переменные самого nginx не затрагиваются).
  nginx:
    profiles: ["nginx"]
    image: nginx:1.29-alpine
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DJANGO_PORT=${DJANGO_PORT:-8000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/personal-website.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${STORAGE_ROOT:-./storage/}:/srv/media:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/acme-webroot:/var/www/certbot:rw
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/health/"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Выпуск и продление сертификатов Let's Encrypt. Сервис не работает
  # постоянно: команды запускаются через docker compose run --rm certbot ...
  # Профиль certbot активируется только явным именем сервиса в команде run.
  certbot:
    profiles: ["certbot"]
    image: certbot/certbot:latest
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt:rw
      - ./nginx/acme-webroot:/var/www/certbot:rw
    logging: *default-logging

  # Кластер PostgreSQL для веб-сайта. База данных создается автоматически.
  # Сервис предназначен для окружений, где база данных не предоставляется
  # внешним сервисом (managed-кластер или systemd-PostgreSQL на хосте).
  # Поднимается при активном профиле postgres (флаг --profile postgres,
  # переменная COMPOSE_PROFILES или явное имя сервиса в команде up).
  postgres:
    profiles: ["postgres"]
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file: .env
    # Порт публикуется только на localhost хоста: внешний доступ к базе
    # данных не предусмотрен, подключаются приложение и утилиты
    # администрирования на самом хосте.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-совместимое объектное хранилище Minio. Предназначено для окружений,
  # где объектное хранилище не предоставляется внешним сервисом (удаленный
  # S3 или локальный каталог при STORAGE_TYPE=filesystem).
  # Поднимается при активном профиле minio (флаг --profile minio,
  # переменная COMPOSE_PROFILES или явное имя сервиса в команде up).
  minio:
    profiles: ["minio"]
    image: minio/minio
    command: minio server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    env_file: .env
    # Порты API (9000) и веб-консоли (9001) публикуются только на localhost
    # хоста: внешний доступ к объектному хранилищу не предусмотрен.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data:rw
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
