{% extends "base.html" %}
{% load react_tags %}
<!-- Шаблон страницы серии блога. -->
{% block title %}
    {{ series.name }}
{% endblock title %}
{% block content %}
    <div class="container">
        <h2>{{ series.name }}</h2>
        {% if series.description %}<p>{{ series.description }}</p>{% endif %}
        {% react_component "Blog/ArticleList" seriesSlug=series.slug %}
    </div>
{% endblock content %}
