{% extends "base.html" %}
{% load react_tags %}
<!-- Шаблон страницы темы блога. -->
{% block title %}
    {{ topic.name }}
{% endblock title %}
{% block content %}
    <div class="container">
        <h2>{{ topic.name }}</h2>
        {% if topic.description %}<p>{{ topic.description }}</p>{% endif %}
        {% react_component "Blog/ArticleList" topicSlug=topic.slug %}
    </div>
{% endblock content %}
