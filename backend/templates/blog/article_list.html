{% extends "base.html" %}
{% load react_tags %}
<!-- Шаблон корневой страницы блога, наследует от базового шаблона. -->
{% block content %}
    <div class="container-fluid">
        <div class="mb-3">
            {% react_component "Search/SearchForm" search=search targetUrl="/blog/" placeholder="Поиск по статьям..." %}
        </div>
        {% react_component "Blog/ArticleList" apiUrl="/api/blog/articles/" search=search %}
    </div>
{% endblock content %}
