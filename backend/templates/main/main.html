{% extends "base.html" %}
{% load static %}
{% load react_tags %}
<!--
    Главная страница сайта. Взаимосвязана с блогом.
    Отображает категории и серии статей из блога,
    сгруппированные в виде карточек.
    Рендерится через React компонент HomePage.
-->
{% block content %}
    <!-- На главной странице нет текста заголовка, поэтому h1 скрыт визуально и предназначен для скринридеров -->
    <h1 class="visually-hidden">Главная</h1>
    {% react_component "Main/HomePage" %}
{% endblock content %}
